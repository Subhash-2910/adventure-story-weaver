name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU-only torch: much smaller download than the default CUDA build
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: CLI works end to end with the committed model
        run: |
          python -m app.cli hello
          python -m app.cli generate "The cave mouth was black, and" --length 40 --seed 1
